[project]
name = "neuroops"
version = "0.3.0"
description = "Extensible MLOps platform for tabular and EEG research workflows"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
  { name = "Emmanuel Arizabaleta" },
  { name = "NeuroOps contributors" },
]
dependencies = [
  "alembic>=1.16,<2",
  "cloudpickle>=3.1,<4",
  "fastapi>=0.116,<1",
  "httpx[socks]>=0.28,<1",
  "joblib>=1.5,<2",
  "matplotlib>=3.10,<4",
  "mlflow>=3.5,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "prefect>=3.4,<4",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "scikit-learn>=1.6,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
eeg = [
  "mne==1.12.1",
  "mne-bids==0.19.0",
]
xgboost = ["xgboost>=3,<4"]
deep-learning = ["torch>=2.7,<3"]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
